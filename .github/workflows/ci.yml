name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run lint:check
      - run: bun run typecheck
      - run: bun run build

      # Uses the build above, so the swagger CLI plugin's metadata is included.
      - name: Export OpenAPI spec
        run: bun dist/src/scripts/export-openapi.js openapi.json
        env:
          JWT_SECRET: ci-only-secret

      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: openapi.json

  test:
    name: Unit & e2e tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trek
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The e2e global setup creates and migrates trek_test from this URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trek
      MAX_DB_CONNECTIONS: '10'
      JWT_SECRET: ci-only-secret
      JWT_EXPIRES_IN: 1h
      BCRYPT_SALT_ROUNDS: '4'
      SEED_ADMIN_EMAIL: admin@trek.ci
      SEED_ADMIN_PASSWORD: ci-admin-password
      SEED_ADMIN_FIRST_NAME: Ci
      SEED_ADMIN_LAST_NAME: Admin

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'

      # Jest runs on Node (via its shebang); match the local major version.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - run: bun run test
      - run: bun run test:e2e

  docker:
    name: Docker image & compose stack
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: ci-only-secret
      SEED_ADMIN_EMAIL: admin@trek.ci
      SEED_ADMIN_PASSWORD: ci-admin-password
      BCRYPT_SALT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@v4

      # The agent only needs these to start; its health check never calls the model.
      - name: Agent settings
        run: printf 'OPENROUTER_API_KEY=ci-dummy-key\nAGENT_MODEL=ci/no-model\n' > agent/.env

      # Builds the images, migrates and seeds a fresh database, and waits for
      # the API's and the agent's health checks to pass.
      - run: docker compose up --build --detach --wait --wait-timeout 300

      - name: API and agent are ready and serving
        run: |
          curl --fail --silent http://localhost:3000/api/health/ready
          curl --fail --silent --output /dev/null http://localhost:3000/api/docs-json
          curl --fail --silent http://localhost:8000/health
          # The agent reaches the API over the compose network: a bogus token
          # is rejected by the API itself (401), not a connection error (502).
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://localhost:8000/chat -H 'Authorization: Bearer bogus' \
            -H 'Content-Type: application/json' -d '{"message":"hi"}')" = 401

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - if: always()
        run: docker compose down --volumes

  agent:
    name: Agent (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Tests use a scripted model and a fake Trek API: no key or network.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
