[project]
name = "trek-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RUBAGUMYA Mike Galen", email = "hyllusx@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "pydantic-ai-slim[openai]>=2.67.0",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
trek-agent = "trek_agent:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
